<style>
/* --- Polices auto-hébergées, partagées avec le site Motor Consulting --- */
@font-face{font-family:'Archivo';font-style:normal;font-weight:300 700;font-display:swap;src:url('../assets/fonts/archivo-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Archivo';font-style:normal;font-weight:300 700;font-display:swap;src:url('../assets/fonts/archivo-latin.woff2') format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Michroma';font-style:normal;font-weight:400;font-display:swap;src:url('../assets/fonts/michroma-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Michroma';font-style:normal;font-weight:400;font-display:swap;src:url('../assets/fonts/michroma-latin.woff2') format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

:root{
  color-scheme:dark;
  --noir:#000000;
  --noir-2:#0b0b0c;
  --rouge:#d8161f;
  --rouge-glow:rgba(216,22,31,.55);
  --or:#d4af37;
  --or-clair:#f3e2a4;
  --argent:#c9ced4;
  --texte:#f2f1ec;
  --texte-2:#b8bcc2;
  --texte-3:#6e7278;
  --grad-chrome:linear-gradient(180deg,#ffffff 0%,#d3d7dc 42%,#7a8087 52%,#cfd4da 62%,#f4f6f8 100%);
  --grad-or:linear-gradient(90deg,#8a6e1e 0%,#f3e2a4 40%,#d4af37 60%,#8a6e1e 100%);
  --font:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Michroma","Archivo",sans-serif;
  --t:.35s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--noir);color:var(--texte);font-family:var(--font);font-weight:300;
  line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;
  padding:18px 14px 28px;min-height:100dvh;justify-content:center
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--rouge);outline-offset:6px}

/* Texte chromé (dégradé + ombre portée pour l'effet métal) */
.chrome{
  background:var(--grad-chrome);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.85))
}

/* ---------- La carte ---------- */
.card{
  position:relative;width:100%;max-width:1280px;
  background:radial-gradient(120% 90% at 50% 0%,#141416 0%,#050506 60%,#000 100%);
  border:1px solid #b9bec5;border-radius:26px;
  box-shadow:0 0 0 1px #2a2d31 inset,0 0 0 3px #000 inset,0 0 0 4px #4d5257 inset,0 30px 80px rgba(0,0,0,.8);
  overflow:hidden;display:flex;flex-direction:column
}

/* ---------- En-tête holding ---------- */
.holding{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:56px 24px 40px;gap:0
}
.mc{width:min(300px,52vw);height:auto;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.9))}
.holding__name{
  margin:22px 0 0;font-family:var(--font-display);font-weight:400;
  font-size:clamp(1.55rem,5.2vw,3.3rem);letter-spacing:.22em;padding-left:.22em;line-height:1.1
}
.holding__sub{
  display:flex;align-items:center;gap:22px;margin-top:14px;width:min(760px,90%);
  font-family:var(--font-display);font-size:clamp(.8rem,2vw,1.15rem);letter-spacing:.42em;padding-left:.42em
}
.holding__sub i{flex:1;height:2px;background:var(--rouge);box-shadow:0 0 8px var(--rouge-glow)}
.holding__tag{
  margin:20px 0 0;font-family:var(--font);font-weight:500;font-size:clamp(.66rem,1.6vw,.98rem);
  letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:var(--texte-2)
}

/* Filet rouge */
.rule{height:2px;margin:0;border:0;background:var(--rouge);box-shadow:0 0 12px var(--rouge-glow)}

/* ---------- Les deux marques ---------- */
.brands{display:grid;grid-template-columns:1fr;position:relative}
.brand{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;
  padding:40px 28px 44px;transition:background var(--t)
}
.brand:hover,.brand:focus-visible{background:rgba(255,255,255,.025)}
.brand + .brand::before{
  content:"";position:absolute;left:8%;right:8%;top:0;height:2px;background:var(--rouge);box-shadow:0 0 10px var(--rouge-glow)
}
.brand__logo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;width:min(340px,100%)}
.mark{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.9));margin-bottom:-8px}
.brand__name{font-family:var(--font-display);font-size:clamp(2rem,7vw,3.1rem);letter-spacing:.12em;padding-left:.12em;line-height:1}
.brand__sub{
  display:flex;align-items:center;gap:14px;width:100%;
  font-family:var(--font-display);font-size:clamp(.82rem,2.3vw,1.15rem);letter-spacing:.34em;padding-left:.34em;
  background:var(--grad-or);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.8))
}
.brand__sub i{flex:1;height:1.5px;background:var(--grad-or)}
.brand__tag{
  margin-top:12px;font-family:var(--font);font-weight:400;font-size:clamp(.62rem,1.5vw,.8rem);
  letter-spacing:.28em;padding-left:.28em;text-transform:uppercase;color:var(--texte-2);max-width:32ch;line-height:1.7
}
.brand__qr{
  width:132px;height:132px;flex:none;border-radius:8px;overflow:hidden;
  box-shadow:0 0 0 1px #3a3f45,0 8px 24px rgba(0,0,0,.8);transition:transform var(--t),box-shadow var(--t)
}
.brand__qr img{width:100%;height:100%;display:block}
.brand:hover .brand__qr{transform:translateY(-2px);box-shadow:0 0 0 1px #6c727a,0 14px 30px rgba(0,0,0,.9)}
.brand__cta{
  font-family:var(--font);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--texte-3);
  transition:color var(--t)
}
.brand:hover .brand__cta{color:var(--texte)}
.brand__cta span{color:var(--rouge)}

/* ---------- Pied ---------- */
.foot{
  width:100%;max-width:1280px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;
  padding:18px 8px 0;font-size:.74rem;color:var(--texte-3);letter-spacing:.04em
}
.foot p{margin:0}
.foot ul{display:flex;gap:22px;margin:0;padding:0;list-style:none}
.foot a:hover{color:var(--texte)}

/* ---------- Bureau ---------- */
@media (min-width:860px){
  body{padding:28px 24px 36px}
  .holding{padding:64px 40px 44px}
  .brands{grid-template-columns:1fr 1fr}
  .brand{flex-direction:row;justify-content:center;gap:40px;padding:56px 44px 60px;text-align:left}
  .brand + .brand::before{left:0;right:auto;top:10%;bottom:10%;height:auto;width:2px}
  .brand__logo{width:min(360px,60%)}
  .brand__qr{width:150px;height:150px}
  .brand__cta{position:absolute;bottom:18px;left:0;right:0;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>

  <header class="holding">

    <svg class="mc" viewBox="0 0 300 130" role="img" aria-label="Monogramme MC">
      <defs>
        <linearGradient id="mc-chr" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/><stop offset="42%" stop-color="#d3d7dc"/><stop offset="52%" stop-color="#7a8087"/><stop offset="63%" stop-color="#cfd4da"/><stop offset="100%" stop-color="#f4f6f8"/>
        </linearGradient>

              <stop offset="0%" stop-color="#8a6e1e"/><stop offset="40%" stop-color="#f3e2a4"/><stop offset="60%" stop-color="#d4af37"/><stop offset="100%" stop-color="#8a6e1e"/>

          </defs>

          <path d="M126 46V32l24-18 24 18v14" fill="none" stroke="url(#mk-gld-c)" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>

  <ul>
